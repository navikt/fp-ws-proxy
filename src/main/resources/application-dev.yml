management :
  endpoints:
    web:
      exposure:
        include:  '*'
  endpoint:
    health:
      show-details : always
spring:
  config.import: vault://
  cloud:
    vault:
      reactive:
        enabled: false
      enabled: true
      uri: https://vault.adeo.no
      authentication: KUBERNETES
      kubernetes:
        role: fpwsproxy
        kubernetes-path: kubernetes/preprod/fss
      kv:
        enabled: true
        backend: kv/preprod/fss
        application-name: fpwsproxy/teamforeldrepenger
        default-context: fpwsproxy/teamforeldrepenger
  mvc:
    log-request-details: true

## SIKKERHET ##
no.nav.security.jwt:
  issuer:
    sts:
      discoveryurl: https://security-token-service.nais.preprod.local/.well-known/openid-configuration

# Brukers av clientene på utgående kall (WS eller RS)
securitytokenservice:
  url: ${SECURITYTOKENSERVICE_URL}

## INTEGRASJONER ##
meldekortutbetalingsgrunnlag:
  v1:
    url: ${MELDEKORTUTBETALINGSGRUNNLAG_URL}
oppdrag:
  service:
    url: ${OPPDRAG_BASE_URL}/simulerFpServiceWSBinding
tilbakekreving:
  v1:
    url: ${OPPDRAG_BASE_URL}/K231CW80


