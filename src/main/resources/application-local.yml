meldekortutbetalingsgrunnlag:
  v1:
    url: https://localhost:8063/soap/ail_ws/MeldekortUtbetalingsgrunnlag_v1
oppdrag:
  service:
    url: https://localhost:8063/soap/cics/services/oppdragService
tilbakekreving:
  v1:
    url: https://localhost:8063/soap/tilbakekreving/services/tilbakekrevingService
