spring:
  config.import: vault://
  cloud:
    vault:
      reactive:
        enabled: false
      enabled: true
      uri: https://vault.adeo.no
      authentication: KUBERNETES
      kubernetes:
        role: k9wsproxy
        kubernetes-path: kubernetes/prod/fss
      kv:
        enabled: true
        backend: kv/prod/fss
        application-name: k9wsproxy/k9saksbehandling
        default-context: k9wsproxy/k9saksbehandling
