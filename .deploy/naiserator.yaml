apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: fpwsproxy
  namespace: teamforeldrepenger
  labels:
    team: teamforeldrepenger
spec:
  image: {{image}}
  port: 8080
  ingresses:
  {{#each ingresses as |url|}}
      - {{url}}
  {{/each}}
  replicas:
    min: {{minReplicas}}
    max: {{maxReplicas}}
    scalingStrategy:
      cpu:
        thresholdPercentage: 80
  liveness:
    path: /fpwsproxy/actuator/health/liveness
    initialDelay: 15
    timeout: 5
    periodSeconds: 10
    failureThreshold: 27
  readiness:
    path: /fpwsproxy/actuator/health/readiness
    initialDelay: 15
    timeout: 5
    periodSeconds: 10
    failureThreshold: 27
  prometheus:
    enabled: true
    path: /fpwsproxy/actuator/prometheus
  resources:
    limits:
      cpu: "{{limits.cpu}}"
      memory: "{{limits.mem}}"
    requests:
      cpu: "{{requests.cpu}}"
      memory: "{{requests.mem}}"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "grafana-lgtm"
        - id: "elastic-apm"
    logging:
      destinations:
        - id: loki
        - id: elastic
  vault:
    enabled: true
    paths:
      - mountPath: {{vault.mountPath}}/serviceuser
        kvPath: {{vault.serviceuser.secretsPath}}
  azure:
    application:
      enabled: true
  {{#if AZURE_IAC_RULES}}
  accessPolicy:
    outbound:
      rules:
      - application: logging
        namespace: nais-system
    inbound:
      rules:
      {{#each AZURE_IAC_RULES}}
      - application: {{app}}
        namespace: {{namespace}}
        cluster: {{cluster}}
        {{#if scopes}}
        permissions:
          scopes:
          {{#each scopes}}
            - "{{this}}"
          {{/each}}
        {{/if}}
      {{/each}}
  {{/if}}
